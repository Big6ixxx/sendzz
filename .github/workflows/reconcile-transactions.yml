name: Reconcile transactions

# A BACKSTOP for /api/cron/reconcile-transactions, not the primary schedule.
#
# The primary is a Coolify scheduled task running every 2 minutes. That cadence matters: a
# payout quote lives about 16 minutes, so a job that runs less often can only ever record the
# failure rather than prevent it. GitHub will not schedule faster than every 5 minutes, which
# is why this cannot be the primary.
#
# It stays because it runs from outside the deployment: if the app host is wedged, this still
# fires and the failure is visible in the Actions tab rather than silent.
#
# Setup (repo → Settings → Secrets and variables → Actions):
#   • Secret  DEPLOY_URL   – your deployment origin, e.g. https://app.sendzz.io
#   • Secret  CRON_SECRET  – the SAME value as the CRON_SECRET env var in Coolify
# (GitHub-scheduled runs can lag a few minutes under load, which is expected.)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reconciliation endpoint
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.DEPLOY_URL }}/api/cron/reconcile-transactions")
          echo "HTTP $code"
          cat /tmp/body
          test "$code" = "200"
